
services:
  cetolhlcs-ros2-node:
    build:
      context: .
      dockerfile: dockerfile.CETOHLCS-ros2-pi
    container_name: cetolhlcs-ros2-node
    network_mode: host
    ipc: host
    pid: host
    shm_size: '512m'
    privileged: false
    volumes:
      - ./../ros2:/ros2
      - /sys:/sys
    # Direct character device mapping for SPI 1 and I2C 1
    devices:
      - "/dev/ttyS0:/dev/ttyS0"           # Primary UART / Serial (or /dev/ttyAMA0)
      - "/dev/ttyAMA3:/dev/ttyAMA3"
      - "/dev/ttyAMA4:/dev/ttyAMA4"
      - "/dev/ttyAMA5:/dev/ttyAMA5"
      - "/dev/gpiochip0:/dev/gpiochip0"   # Modern libgpiod interface
      - "/dev/i2c-4:/dev/i2c-4"           # I2C Bus 4
      - "/dev/i2c-1:/dev/i2c-1"
      - "/dev/i2c-1:/dev/i2c-6"           # I2C Bus 6
      - "/dev/spidev0.0:/dev/spidev0.0"
      - "/dev/spidev1.2:/dev/spidev1.2"
      # (Keep any existing lines like /dev/ttyS0 or /dev/gpiochip0 if you need them)

    # Grant container access to host hardware groups
    group_add:
      - "20"    # Typical 'dialout' group for UART/Serial
      - "997"   # Typical 'gpio' group on Raspberry Pi OS
      - "988"   # Typical 'i2c' group ID on Raspberry Pi OS
      - "989"   # Typical 'spi' group ID on Raspberry Pi OS
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=1
    command: >
          bash -c "source /opt/ros/humble/setup.bash &&
           cd /ros2 &&
           exec tail -f /dev/null"
    restart: unless-stopped
